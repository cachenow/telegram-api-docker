name: Build Telegram API server
on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 */7 * *"
  
permissions:
  contents: read
  packages: write
  actions: write
jobs:
  build:
    # Build on native AMD64 and ARM64 runners to avoid cross-arch emulation
    name: Build ${{ matrix.arch }} Version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout API repository
        uses: actions/checkout@v4
        with:
          repository: 'tdlib/telegram-bot-api'
          path: 'tdlib-telegram-bot-api'
      - name: Checkout Dockerfile from this repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: 'self'
      - name: Apply Dockerfile to source directory
        run: |
          cp ./self/Dockerfile ./tdlib-telegram-bot-api/Dockerfile
      - name: Export short SHA and run number
        id: get_sha
        run: |
          echo "GITHUB_SHA=$(echo ${GITHUB_SHA::8})" >> $GITHUB_ENV
          echo "GITHUB_RUN_ID=$(echo ${GITHUB_RUN_NUMBER})" >> $GITHUB_ENV
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare tags and labels for push
        id: prep
        run: |
          REPO_NAME=$(echo "$GITHUB_REPOSITORY" | cut -d/ -f2)
          DOCKER_IMAGE=ghcr.io/${{ github.repository_owner }}/${REPO_NAME}
          VERSION=edge
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            VERSION=nightly
          fi
          TAGS="${DOCKER_IMAGE}:${VERSION}"
          if [[ $VERSION =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            TAGS="$TAGS,${DOCKER_IMAGE}:latest"
          fi
          TG_API_VERSION=$(grep "project(TelegramBotApi" tdlib-telegram-bot-api/CMakeLists.txt | awk '{print $3}')
          TAGS="$TAGS,$DOCKER_IMAGE:${{ env.GITHUB_SHA }},$DOCKER_IMAGE:1.0.${{ env.GITHUB_RUN_ID }},$DOCKER_IMAGE:latest,$DOCKER_IMAGE:api-$TG_API_VERSION"
          ARCH_SUFFIX="-${{ matrix.arch }}"
          TAGS_ARCH=$(echo "$TAGS" | sed "s/,/\n/g" | sed "s/$/${ARCH_SUFFIX}/")
          {
            echo "tags_arch<<EOF"
            echo "$TAGS_ARCH"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          # lowercase the branch name
          BRANCH=$(echo ${GITHUB_REF##*/} | tr '[A-Z]' '[a-z]')
          LABELS="org.opencontainers.image.revision=$GITHUB_SHA"
          LABELS="$LABELS,org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          LABELS="$LABELS,org.opencontainers.image.version=$VERSION"
          LABELS="$LABELS,com.github.repo.branch=$BRANCH"
          LABELS="$LABELS,com.github.repo.dockerfile=Dockerfile"
          echo "labels=${LABELS}" >> $GITHUB_OUTPUT
      - name: Build and push image for current arch
        id: docker_build
        timeout-minutes: 900
        uses: docker/build-push-action@v5
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: tdlib-telegram-bot-api
          file: tdlib-telegram-bot-api/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.prep.outputs.tags_arch }}
          labels: ${{ steps.prep.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Save image digest
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ steps.docker_build.outputs.digest }}" > digest.txt
      - name: Upload image digest artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digest.txt

  manifest:
    name: Create and publish multi-arch manifests
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout API repository
        uses: actions/checkout@v4
        with:
          repository: 'tdlib/telegram-bot-api'
          path: 'tdlib-telegram-bot-api'
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare base tags
        id: prep
        run: |
          REPO_NAME=$(echo "$GITHUB_REPOSITORY" | cut -d/ -f2)
          DOCKER_IMAGE=ghcr.io/${{ github.repository_owner }}/${REPO_NAME}
          VERSION=edge
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            VERSION=nightly
          fi
          TAGS="${DOCKER_IMAGE}:${VERSION}"
          if [[ $VERSION =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            TAGS="$TAGS,${DOCKER_IMAGE}:latest"
          fi
          TG_API_VERSION=$(grep "project(TelegramBotApi" tdlib-telegram-bot-api/CMakeLists.txt | awk '{print $3}')
          SHORT_SHA=$(echo ${GITHUB_SHA::8})
          RUN_ID=${GITHUB_RUN_NUMBER}
          # Reorder so that 'latest' is created last, influencing GHCR UI hint
          TAGS="$TAGS,$DOCKER_IMAGE:${SHORT_SHA},$DOCKER_IMAGE:1.0.${RUN_ID},$DOCKER_IMAGE:api-$TG_API_VERSION,$DOCKER_IMAGE:latest"
          echo "tags=$(echo $TAGS)" >> $GITHUB_OUTPUT
          echo "image=${DOCKER_IMAGE}" >> $GITHUB_OUTPUT
      - name: Download amd64 digest
        uses: actions/download-artifact@v4
        with:
          name: digest-amd64
          path: digests/amd64
      - name: Download arm64 digest
        uses: actions/download-artifact@v4
        with:
          name: digest-arm64
          path: digests/arm64
      - name: Create multi-arch manifests
        run: |
          IFS=',' read -r -a TAG_LIST <<< "${{ steps.prep.outputs.tags }}"
          AMD64_DIGEST=$(cat digests/amd64/digest.txt)
          ARM64_DIGEST=$(cat digests/arm64/digest.txt)
          IMAGE="${{ steps.prep.outputs.image }}"
          for TAG in "${TAG_LIST[@]}"; do
            echo "Merging tag: $TAG"
            docker buildx imagetools create \
              -t "$TAG" \
              "$IMAGE@${AMD64_DIGEST}" \
              "$IMAGE@${ARM64_DIGEST}"
          done
      - name: Delete workflow runs
        uses: GitRML/delete-workflow-runs@main
        with:
          retain_days: 180
          keep_minimum_runs: 0
